# ============================================================
# Default Catch-All Server (HTTP & HTTPS)
# Menolak / mengembalikan 404 untuk domain yang tidak terdaftar
# ============================================================

# HTTP Catch-All (Port 80)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404 "404 Not Found — Domain is not configured on this proxy.\n";
    }
}

# HTTPS Catch-All (Port 443)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/dummy.crt;
    ssl_certificate_key /etc/nginx/ssl/dummy.key;

    location / {
        return 404 "404 Not Found — Domain is not configured on this proxy.\n";
    }
}

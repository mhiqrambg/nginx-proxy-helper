# ============================================================
# Default Catch-All Server
# Menolak / mengembalikan 404 untuk domain yang belum didaftarkan
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404 "404 Not Found — Domain is not configured on this proxy.\n";
    }
}
